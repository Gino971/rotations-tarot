<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123e33">
  <meta name="description" content="Les positions de tous vos joueurs de tarot pour chaque manche, sans noms ni scores.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rotations Tarot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>Rotations Tarot</title>
</head>
<body>
  <header class="topbar"><h1><a href="./"><span class="brand-icon" aria-hidden="true">♠</span> Rotations Tarot</a></h1></header>
  <main>
    <section id="setup" class="panel" aria-label="Réglages">
      <form id="setup-form">
        <div class="field-grid"><label>Nombre de joueurs<select id="count"></select></label><label>Nombre de manches<select id="rounds"></select></label></div>
        <fieldset id="mode-field"><legend>Répartition</legend><div id="modes"></div></fieldset>
        <fieldset id="excluded-field" hidden><legend>Exclus</legend><div id="exclusion-selectors" class="field-grid"></div></fieldset>
        <p id="error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="results" hidden aria-label="Placements">
      <div class="result-controls"><div class="tabs" role="tablist" aria-label="Vue du plan"><button id="by-player" role="tab" aria-selected="true" aria-controls="player-view" class="active">Par joueur</button><button id="by-round" role="tab" aria-selected="false" aria-controls="round-view">Par manche</button></div></div>
      <div id="player-view" role="tabpanel" aria-labelledby="by-player">
        <label class="search">Joueur<input id="search" type="number" inputmode="numeric" min="1" placeholder="N°"></label>
        <div id="player-cards" class="player-grid"></div>
      </div>
      <div id="round-view" role="tabpanel" aria-labelledby="by-round" hidden><div class="round-navigation"><button id="previous" class="secondary" aria-label="Manche précédente">←</button><label>Manche<select id="current-round"></select></label><button id="next" class="secondary" aria-label="Manche suivante">→</button></div><p id="excluded-notice" class="notice" hidden></p><div id="table-cards" class="table-grid"></div></div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
