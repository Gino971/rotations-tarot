<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bibliothèque · Rotations</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px}.panel{max-width:none}.library-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.library-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}.library-row small{display:block;color:var(--muted);margin-top:5px}.library-row .buttons{display:flex;gap:8px}#library-message{min-height:1.5em;margin:16px 0}#library-form{display:grid;gap:16px;background:#f5f4ed;padding:20px;border-radius:12px;margin:20px 0}.form-buttons{display:flex;gap:12px}.form-buttons .primary{margin:0;width:auto}#library-add{width:auto;margin:0}button{white-space:nowrap}@media(max-width:600px){.library-row{align-items:flex-start;flex-direction:column}.library-heading{align-items:flex-start;flex-direction:column}}</style></head>
<body><header class="topbar"><a href="/#arbitrage">♠ Rotations</a><a href="/#arbitrage">Retour à l’arbitrage</a></header><main>
<div class="library-heading"><h2>Gestion de la bibliothèque</h2><button id="library-add" class="primary">＋ Ajouter un document</button></div>
<p class="hint">Bibliothèque commune du projet. Les changements seront disponibles pour tous après publication de l’app.</p>
<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0"><button id="library-publish" class="secondary">Publier la bibliothèque</button><a id="library-published-link" href="https://gino971.github.io/rotations-tarot/#arbitrage" target="_blank" rel="noopener" hidden>Ouvrir la bibliothèque publiée ↗</a></div>
<p id="library-publication" role="status" aria-live="polite"></p>
<p id="library-message" role="status" aria-live="polite"></p>
<form id="library-form" hidden><h3 id="library-form-title">Ajouter un document</h3><label>Titre du document<input id="library-title" maxlength="120" required></label><label>Fichier PDF ou texte<input id="library-file" type="file" accept=".pdf,.txt,application/pdf,text/plain" required></label><p class="hint">10 Mo maximum. Les PDF doivent contenir du texte sélectionnable.</p><div class="form-buttons"><button id="library-save" class="primary" type="submit">Enregistrer</button><button id="library-cancel" class="secondary" type="button">Annuler</button></div></form>
<section class="panel" aria-label="Documents"><div id="library-list"></div></section>
</main><script type="module" src="library.js"></script></body></html>
